name: 功能建议
description: 为本项目提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请描述你希望增加或改进的功能。
  - type: textarea
    id: problem
    attributes:
      label: 需求背景
      description: 这个功能要解决什么问题？或在什么场景下需要它？
      placeholder: 希望在统计页面支持按「人员/机构」维度汇总收支……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 方案设想
      description: 你期望它如何工作？可以描述交互、界面或数据流程。
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你是否考虑过其他实现方式？
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 参考资料、截图、对照「财智8」的对应功能等。
    validations:
      required: false
